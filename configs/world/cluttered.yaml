# Dense convex obstacles (borrowed from NeuPAN convex_obs): 30x30 arena with
# ~14 manual circles/polygons; complements robot_world (static, larger arena).
world:
  height: 30
  width: 30
  step_time: 0.3
  sample_time: 0.3
  collision_mode: 'stop'
  control_mode: 'auto'

robot:
  - kinematics: {name: 'diff'}
    shape: {name: 'rectangle', length: 0.4, width: 0.3}   # real robot 40cm(front) x 30cm
    vel_min: [-1.0, -1.0]
    vel_max: [1.0, 1.0]
    state: [4, 26, 0]
    goal: [24, 8, 0]
    arrive_mode: position
    goal_threshold: 0.3
    sensors:
      - type: 'lidar2d'
        range_min: 0
        range_max: 7
        angle_range: 3.14
        number: 100
        noise: True
        std: 0.08
        angle_std: 0.1
        offset: [0.101, 0, 0]   # real lidar mount 10.1cm in front of base center
        alpha: 0.3
    plot:
      show_trajectory: True

obstacle:
  # circles (manual, radius randomly 1.5 / 1.0 / 0.8 per instance)
  - number: 12
    distribution: {name: 'manual'}
    shape:
      - {name: 'circle', radius: 1.5}
      - {name: 'circle', radius: 1.0}
      - {name: 'circle', radius: 0.8}
    state: [[10, 12], [20, 10], [22, 22], [9, 21], [16, 18], [17, 6],
             [25, 14], [5, 17], [13, 8], [18, 25], [26, 24], [6, 25]]

  # one convex polygon (same vertices style as NeuPAN convex_obs)
  - number: 1
    distribution: {name: 'manual'}
    state: [0, 0, 0]
    shape:
      - {name: 'polygon', vertices: [[14, 24], [16, 24], [16, 27], [14, 27]]}

  # boundary thin-rectangle walls
  - number: 4
    distribution: {name: 'manual'}
    shape:
      - {name: 'rectangle', length: 30, width: 0.5}
    state: [[15, 0.25, 0], [15, 29.75, 0], [0.25, 15, 1.57], [29.75, 15, 1.57]]
