# Open field (borrowed from NeuPAN non_obs): 30x30 empty arena, boundary walls
# far away (>8m from start/goal) so the 7m lidar sees nothing -> all-max obs.
# Goal: bring "all-clear lidar" observations into the training distribution
# to fix the open-field circling behavior. obs contract identical to robot_world
# (diff circle 0.2 / lidar 100 beams range 7 / vel [-1,1] / step 0.3).
world:
  height: 30
  width: 30
  step_time: 0.3
  sample_time: 0.3
  collision_mode: 'stop'
  control_mode: 'auto'

robot:
  - kinematics: {name: 'diff'}
    shape: {name: 'rectangle', length: 0.4, width: 0.3}   # real robot 40cm(front) x 30cm
    vel_min: [-1.0, -1.0]
    vel_max: [1.0, 1.0]
    state: [10, 10, 0]
    goal: [20, 20, 0]
    arrive_mode: position
    goal_threshold: 0.3
    sensors:
      - type: 'lidar2d'
        range_min: 0
        range_max: 7
        angle_range: 3.14
        number: 100
        noise: True
        std: 0.08
        angle_std: 0.1
        offset: [0.101, 0, 0]   # real lidar mount 10.1cm in front of base center
        alpha: 0.3
    plot:
      show_trajectory: True

obstacle:
  # boundary thin-rectangle walls (far away, keep robot inside; avoid linestring ghost collision)
  - number: 4
    distribution: {name: 'manual'}
    shape:
      - {name: 'rectangle', length: 30, width: 0.5}
    state: [[15, 0.25, 0], [15, 29.75, 0], [0.25, 15, 1.57], [29.75, 15, 1.57]]
