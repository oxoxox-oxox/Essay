# Sparse obstacles (borrowed from NeuPAN non_obs): 30x30 arena with only 6
# random polygons, large open gaps between them -> mix of "open" and "near-obstacle"
# observations; trains goal-approach plus light avoidance.
world:
  height: 30
  width: 30
  step_time: 0.3
  sample_time: 0.3
  collision_mode: 'stop'
  control_mode: 'auto'

robot:
  - kinematics: {name: 'diff'}
    shape: {name: 'rectangle', length: 0.4, width: 0.3}   # real robot 40cm(front) x 30cm
    vel_min: [-1.0, -1.0]
    vel_max: [1.0, 1.0]
    state: [6, 6, 0]
    goal: [24, 24, 0]
    arrive_mode: position
    goal_threshold: 0.3
    sensors:
      - type: 'lidar2d'
        range_min: 0
        range_max: 7
        angle_range: 3.14
        number: 100
        noise: True
        std: 0.08
        angle_std: 0.1
        offset: [0.101, 0, 0]   # real lidar mount 10.1cm in front of base center
        alpha: 0.3
    plot:
      show_trajectory: True

obstacle:
  - number: 6
    distribution: {name: 'manual'}
    shape:
      - {name: 'polygon', random_shape: true, center_range: [0, 0, 0, 0],
         avg_radius_range: [0.8, 1.5], irregularity_range: [0.3, 0.7], num_vertices_range: [4, 6]}
    state: [[9, 12, 0], [21, 10, 0], [22, 22, 0], [8, 21, 0], [16, 18, 0], [17, 6, 0]]

  # boundary thin-rectangle walls
  - number: 4
    distribution: {name: 'manual'}
    shape:
      - {name: 'rectangle', length: 30, width: 0.5}
    state: [[15, 0.25, 0], [15, 29.75, 0], [0.25, 15, 1.57], [29.75, 15, 1.57]]
