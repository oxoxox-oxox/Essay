# PPO 训练总配置（SB3 PPO，ir-sim 环境）
# 说明：以该文件所在目录为 project root，脚本从仓库根目录运行。

project:
  run_dir: "runs"
  checkpoint_dir: "checkpoints"

# ir-sim 环境（把世界 YAML 放进 configs/world/，这里填文件名即可）
env:
  world_name: "configs/world/robot_world.yaml"   # 单世界训练时用（多世界时被 worlds 取代）
  eval_world: "configs/world/eval_world.yaml"    # 评估场景（评估代码统一使用）
  # ---- 多世界训练（src/train_ppo.py 每次 reset 随机换世界；每项可覆盖 start_range/fixed_goal）----
  # 目的：开阔空场 + 稀疏 + 走廊 + 密集 + 动态，修复"空场绕圈"并保持避障能力
  worlds:
    - world: "configs/world/robot_world.yaml"     # 原训练世界（10x10 动态杂乱）
    - world: "configs/world/open_field.yaml"      # 开阔空场（30x30，激光全满量程）
      start_range_low: [8.0, 8.0, -3.14]
      start_range_high: [22.0, 22.0, 3.14]
      fixed_goal: [15.0, 15.0, 0.0]
    - world: "configs/world/sparse_obs.yaml"      # 稀疏障碍（30x30）
      start_range_low: [5.0, 5.0, -3.14]
      start_range_high: [25.0, 25.0, 3.14]
      fixed_goal: [15.0, 15.0, 0.0]
    - world: "configs/world/corridor.yaml"        # 走廊（30x30）
      start_range_low: [4.0, 14.0, -0.5]
      start_range_high: [8.0, 16.0, 0.5]
      fixed_goal: [24.0, 15.0, 0.0]
    - world: "configs/world/cluttered.yaml"       # 密集凸障碍（30x30）
      start_range_low: [3.0, 3.0, -3.14]
      start_range_high: [27.0, 27.0, 3.14]
      fixed_goal: [24.0, 8.0, 0.0]
    - world: "configs/world/dynamic.yaml"         # 动态障碍（30x30）
      start_range_low: [5.0, 5.0, -3.14]
      start_range_high: [25.0, 25.0, 3.14]
      fixed_goal: [24.0, 24.0, 0.0]
  step_time: 0.0833        # 仿真步长(s) = 1/12，对齐真机 12Hz 雷达帧率（覆盖世界 YAML 的 0.3）
  display: false
  log_level: "WARNING"
  random_start: true                             # 每个 episode 随机机器人初始位置
  start_range_low: [1.0, 1.0, -3.14]             # 随机起点下限 [x, y, theta]
  start_range_high: [9.0, 9.0, 3.14]             # 随机起点上限 [x, y, theta]
  fixed_goal: [9.0, 9.0, 0.0]                    # 固定目标点（世界 YAML 的 goal 亦保持固定）

obs:
  lidar_len: 100            # 仅作参考/一致性检查，实际以 env 读到的 beam 数为准
  lidar_range_max: 7.0      # 归一化用，应与世界 YAML 中 lidar2d.range_max 一致
  max_bins: 100             # lidar 分箱数（DRL 风格：每 bin_size 束取 min / range_max；=lidar_len 时不降维）
  include_goal: true        # 观测是否拼接 goal 极坐标
  goal_dim: 3               # [dist/goal_dist_norm, cos, sin]
  goal_dist_norm: 10.0      # goal 距离归一化除数（对齐 DRL 的 distance/10）
  include_prev_action: true # 观测中编码上一动作（每步按 DRL 归一化 [lin*2, (ang+1)/2]），prev_dim=chunk.size*action_dim
  prev_chunk_size: 1       # 上一动作通道长度（= chunk.size；train_ppo.py 按 --chunk 覆盖）

action:
  action_dim: 2             # [linear_vel, angular_vel]（diff 机器人）
  vel_min: [-1.0, -1.0]
  vel_max: [1.0, 1.0]

reward:
  # 对齐 DRL-robot-navigation-IR-SIM 的奖励（SIM.get_reward）
  # 到达 +goal_reward；碰撞 +collision_penalty；
  # 其他: +lin_vel - ang_penalty_scale*|ang_vel| - 障碍贴近惩罚
  # 障碍贴近惩罚: min(激光距离) < proximity_threshold 时，
  #   减去 proximity_scale * (proximity_threshold - min_laser)，越近罚越多。
  goal_reward: 400.0
  collision_penalty: -100.0
  proximity_threshold: 5    # 障碍贴近惩罚阈值（米），对齐原版
  proximity_scale: 0.5         # (threshold - min_laser) 的缩放系数
  ang_penalty_scale: 0.5       # |angular_vel| 惩罚系数
  backward_penalty: 0.0        # 倒退惩罚：原版无，置 0 关闭
  # ---- goal shaping（修复空场绕圈：让"朝目标"本身有奖励）----
  goal_angle_coef: 0.5         # 朝目标方向奖励系数：+coef*cos(与目标夹角)，朝向+、背对-
  goal_dist_coef: 1.0          # 靠近目标 shaping：每靠近 1m 得 +coef（potential 式，置 0 关闭）
  max_steps: 1800              # 单 episode 最大控制步数（83ms/步 × 1800 ≈ 150s，对齐原 0.3s×500）
  time_penalty: 0.1            # 每步时间惩罚（非到达/碰撞步都减去该值，鼓励尽快到达）

model:
  hidden1: 1024             # SB3 MlpPolicy 第一层隐藏宽度
  hidden2: 1024             # SB3 MlpPolicy 第二层隐藏宽度

chunk:
  size: 1                   # action chunking：N。1=无 chunking（PPO 当前为单步 N=1）

eval:
  max_steps: 1800           # 评估单 episode 步数上限（对齐训练 83ms/步 × 1800）
