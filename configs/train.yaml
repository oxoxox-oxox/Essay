# Master config for PPO training (SB3 PPO, ir-sim env)
# Note: the project root is the directory containing this file; scripts are run from the repo root.

project:
  run_dir: "runs"
  checkpoint_dir: "checkpoints"

# ir-sim env (put world YAML files into configs/world/, fill in the filename here)
env:
  world_name: "configs/world/robot_world.yaml"   # used for single-world training (superseded by worlds when multi-world)
  eval_world: "configs/world/eval_world.yaml"    # eval scenario (used uniformly by eval code)
  # ---- Multi-world training (src/train_ppo.py picks a random world on each reset; each entry can override start_range/fixed_goal) ----
  # Purpose: open field + sparse + corridor + cluttered + dynamic, fixes "open-field circling" while keeping obstacle avoidance
  worlds:
    - world: "configs/world/robot_world.yaml"     # original training world (10x10 dynamic clutter)
    - world: "configs/world/open_field.yaml"      # open field (30x30, lidar at full range)
      start_range_low: [8.0, 8.0, -3.14]
      start_range_high: [22.0, 22.0, 3.14]
      fixed_goal: [15.0, 15.0, 0.0]
    - world: "configs/world/sparse_obs.yaml"      # sparse obstacles (30x30)
      start_range_low: [5.0, 5.0, -3.14]
      start_range_high: [25.0, 25.0, 3.14]
      fixed_goal: [15.0, 15.0, 0.0]
    - world: "configs/world/corridor.yaml"        # corridor (30x30)
      start_range_low: [4.0, 14.0, -0.5]
      start_range_high: [8.0, 16.0, 0.5]
      fixed_goal: [24.0, 15.0, 0.0]
    - world: "configs/world/cluttered.yaml"       # dense convex obstacles (30x30)
      start_range_low: [3.0, 3.0, -3.14]
      start_range_high: [27.0, 27.0, 3.14]
      fixed_goal: [24.0, 8.0, 0.0]
    - world: "configs/world/dynamic.yaml"         # dynamic obstacles (30x30)
      start_range_low: [5.0, 5.0, -3.14]
      start_range_high: [25.0, 25.0, 3.14]
      fixed_goal: [24.0, 24.0, 0.0]
  step_time: 0.0833        # simulation step (s) = 1/12, matches real-robot 12Hz lidar frame rate (overrides the world YAML's 0.3)
  display: false
  log_level: "WARNING"
  random_start: true                             # randomize robot initial pose each episode
  start_range_low: [1.0, 1.0, -3.14]             # random start lower bound [x, y, theta]
  start_range_high: [9.0, 9.0, 3.14]             # random start upper bound [x, y, theta]
  fixed_goal: [9.0, 9.0, 0.0]                    # fixed goal (the world YAML's goal also stays fixed)

obs:
  lidar_len: 100            # reference/consistency check only; the actual beam count comes from the env
  lidar_range_max: 7.0      # used for normalization, must match lidar2d.range_max in the world YAML
  max_bins: 100             # lidar bin count (DRL style: min over each bin_size beams / range_max; no downsampling when =lidar_len)
  include_goal: true        # whether to append the goal polar coordinates to the observation
  goal_dim: 3               # [dist/goal_dist_norm, cos, sin]
  goal_dist_norm: 10.0      # divisor for normalizing goal distance (matches DRL's distance/10)
  include_prev_action: true # encode the previous action in the observation (per-step DRL normalization [lin*2, (ang+1)/2]), prev_dim=chunk.size*action_dim
  prev_chunk_size: 1       # length of the previous-action channel (= chunk.size; train_ppo.py overrides via --chunk)

action:
  action_dim: 2             # [linear_vel, angular_vel] (diff-drive robot)
  vel_min: [-1.0, -1.0]
  vel_max: [1.0, 1.0]

reward:
  # Reward aligned with DRL-robot-navigation-IR-SIM (SIM.get_reward)
  # Reached: +goal_reward; collision: +collision_penalty;
  # otherwise: +lin_vel - ang_penalty_scale*|ang_vel| - obstacle proximity penalty
  # Obstacle proximity penalty: when min(laser distance) < proximity_threshold,
  #   subtract proximity_scale * (proximity_threshold - min_laser), the closer the larger the penalty.
  goal_reward: 400.0
  collision_penalty: -100.0
  proximity_threshold: 5    # obstacle proximity penalty threshold (meters), aligned with the original
  proximity_scale: 0.5         # scale factor for (threshold - min_laser)
  ang_penalty_scale: 0.5       # |angular_vel| penalty coefficient
  backward_penalty: 0.0        # backward penalty: none in the original, set to 0 to disable
  # ---- goal shaping (fixes open-field circling: "heading toward the goal" itself yields reward) ----
  goal_angle_coef: 0.5         # reward coefficient for heading toward the goal: +coef*cos(angle to goal), positive facing it, negative facing away
  goal_dist_coef: 1.0          # approaching-goal shaping: +coef per 1m closer (potential-style, set to 0 to disable)
  max_steps: 1800              # max control steps per episode (83ms/step x 1800 ≈ 150s, matches the original 0.3s x 500)
  time_penalty: 0.1            # per-step time penalty (subtracted from every non-reached/non-collision step, encourages fast arrival)

model:
  hidden1: 1024             # SB3 MlpPolicy first hidden layer width
  hidden2: 1024             # SB3 MlpPolicy second hidden layer width

chunk:
  size: 1                   # action chunking: N. 1=no chunking (PPO currently single-step N=1)

eval:
  max_steps: 1800           # eval per-episode step cap (matches training 83ms/step x 1800)
