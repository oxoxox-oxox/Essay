# 评估专用配置（eval/evaluate.py、eval/run_experiments.py、eval/benchmark.py 默认加载本文件）
# 与 configs/train.yaml 分离：
#   - 训练：train.yaml（env.display: false → headless 加速，训练期间的内部评估同样不渲染）
#   - 评估：本文件（env.display: true → 打开可视化窗口）
#
# ⚠️ env/obs/reward 的取值应与 train.yaml 保持一致（除非有意调整），
#    否则评估条件会与训练条件脱节；模型输入维度始终以 checkpoint 的 meta 为准
#    （eval 脚本会按 meta 覆盖 obs 的 prev_chunk_size / include_prev_action 等）。

project:
  checkpoint_dir: "checkpoints"      # run_experiments.py 按 checkpoints/{name}_N{chunk}/model.pt 找 checkpoint
  run_dir: "runs"
  export_dir: "export"

env:
  world_name: "configs/world/robot_world.yaml"   # run_experiments 的 "static" 场景（注意：此文件含 RVO 动态障碍）
  eval_world: "configs/world/eval_world.yaml"    # evaluate.py 默认场景 / run_experiments 的 "dynamic" 场景（全静态）
  display: true                                  # ★ 评估可视化（训练用 train.yaml 的 false）
  log_level: "WARNING"
  random_start: true                             # 每个 episode 随机机器人初始位置
  start_range_low: [1.0, 1.0, -3.14]
  start_range_high: [9.0, 9.0, 3.14]
  fixed_goal: [9.0, 9.0, 0.0]

obs:
  lidar_len: 100            # 仅参考/一致性检查，实际以 env 读到的 beam 数为准
  lidar_range_max: 7.0      # 归一化用，应与世界 YAML 中 lidar2d.range_max 一致
  max_bins: 100             # lidar 分箱数（=lidar_len 时不降维）
  include_goal: true
  goal_dim: 3               # [dist/goal_dist_norm, cos, sin]
  goal_dist_norm: 10.0
  include_prev_action: true # 评估时按 checkpoint meta 覆盖 prev_chunk_size

action:
  action_dim: 2             # [linear_vel, angular_vel]
  vel_min: [-1.0, -1.0]
  vel_max: [1.0, 1.0]

reward:
  goal_reward: 100.0
  collision_penalty: -100.0
  proximity_threshold: 1.35
  proximity_scale: 0.5
  ang_penalty_scale: 0.5
  backward_penalty: 0.0
  max_steps: 500            # 单 episode 最大控制步数（评估上限）

eval:
  episodes: 20              # run_experiments 每场景 episode 数
  episodes_dynamic: 20
  episodes_visual: 3        # evaluate.py 未显式给 --episodes 时使用（可视化场景少跑几集）
  max_steps: 500

benchmark:
  iterations: 500           # eval/benchmark.py 延迟测量
  warmup: 100
