# PPO deployment parameters (loaded into the global namespace via <rosparam command="load"> in launch)

planner:
  goal_x: 5.0            # goal x (odom_combined frame, relative to start)
  goal_y: 5.0            # goal y
  # Decisions are driven by the lidar frames (each new /scan triggers one serial inference), no fixed-period timer.
  # min_decision_period: minimum interval between consecutive decisions (seconds); 0 = pure lidar-frame-driven (~12Hz).
  #   Training step_time=0.083s (1/12), frame-driven ≈12Hz, consistent with training, keep 0.
  min_decision_period: 0.0
  scan_timeout: 0.5      # stop the robot if no scan is received within this duration
  debug_log: false

  # ---- Aligned with the training side (usually do not change) ----
  num_beams: 100         # training lidar beam count
  range_max_norm: 7.0    # lidar normalization range
  goal_dist_norm: 10.0   # divisor for normalizing goal distance (training obs.goal_dist_norm)
  half_fov_deg: 90.0     # forward half field of view
  reverse_scan: false    # /scan array reversal switch (set after on-site verification)
  laser_yaw_fallback_deg: 180.0  # fallback yaw(laser->base_link) when tf lookup fails

  # ---- action chunking ----
  # chunk_size: use 1 for N=1 models (obs 105); use 5 for N=5 models (obs 113, engine output 10 dims).
  chunk_size: 1

  # ---- previous-action channel ----
  # ⚠️ N=1 models have prev always 0 during training -> false; N=5 models use the prev channel -> must be true.
  #    Must strictly match the model in use (see section 0 of runs/ablation_runbook.md).
  use_prev_action: false

  # ---- action mapping (real velocity from the clipped-to-[-1,1] μ) ----
  vel_min: [-1.0, -1.0]  # normalized action -> real velocity lower bound [lin, ang]
  vel_max: [1.0, 1.0]    # upper bound [lin, ang] (training values)
  max_linear: 0.8        # command clamp (real-robot safety upper bound, try 0.3 low speed first)
  max_angular: 1.0

safety:
  stop_dist: 0.35        # nearest obstacle < this -> emergency stop
  slow_dist: 0.6         # < this -> slow down by slow_factor
  slow_factor: 0.4
  min_voltage: 10.5      # battery below this -> stop
  watchdog_timeout: 0.6  # no planner output within this -> stop
  max_linear: 0.8
  max_angular: 1.0
  front_only: false      # when true, only check the front ±90° nearest distance
